[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "keyringrs"
description = "Python bindings for the Rust keyring crate"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 OR MIT" }
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [
    { name = "The keyringrs developers" },
]
keywords = ["keyring", "credentials", "security", "rust", "pyo3"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]
urls = { Homepage = "https://github.com/aiidateam/keyringrs", Repository = "https://github.com/aiidateam/keyringrs" }
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a configured system keyring backend",
]

[tool.uv]
dev-dependencies = ["pip", "pytest>=8.0.2", "ruff>=0.8.0", "pre-commit>=4.0.1"]

